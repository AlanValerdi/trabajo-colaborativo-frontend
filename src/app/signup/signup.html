<div class="auth-page">
  <section class="auth-form-panel" aria-labelledby="signup-heading">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.75" />
          <path d="M7 9h10M7 13h6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
        </svg>
      </span>
      <span class="brand-name">Reportes</span>
    </header>

    <div class="form-wrap">
      <h1 id="signup-heading">Crea tu cuenta</h1>
      <p class="subtitle">Ingresa tus datos para registrarte</p>

      @if (errorMessage) {
        <div class="field-error" style="margin-bottom: 1rem; color: #dc2626; font-weight: 500;">
          {{ errorMessage }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span class="field-label">Nombre</span>
          <input type="text" formControlName="name" placeholder="Tu nombre" autocomplete="name" />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="field-error">El nombre es obligatorio.</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Correo electrónico</span>
          <input type="email" formControlName="email" placeholder="m@example.com" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="field-error">Ingresa un correo electrónico válido.</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Contraseña</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
          @if (form.controls.password.touched && form.controls.password.hasError('required')) {
            <span class="field-error">La contraseña es obligatoria.</span>
          } @else if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
            <span class="field-error">Usa al menos 8 caracteres.</span>
          }
        </label>

        <label class="field">
          <span class="field-label">Confirmar contraseña</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
          @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')) {
            <span class="field-error">Confirma tu contraseña.</span>
          } @else if (form.touched && form.hasError('passwordsMismatch')) {
            <span class="field-error">Las contraseñas no coinciden.</span>
          }
        </label>

        <button class="btn btn-primary" type="submit">Registrarse</button>
      </form>

      <div class="divider" role="separator">
        <span>O continuar con</span>
      </div>

      <button class="btn btn-outline" type="button">
        <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.46c-.28 1.5-1.12 2.77-2.39 3.63v3.02h3.87c2.26-2.08 3.55-5.14 3.55-8.68Z"
          />
          <path
            fill="#34A853"
            d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.87-3.02c-1.08.72-2.46 1.15-4.08 1.15-3.14 0-5.8-2.12-6.76-4.96H1.24v3.12C3.22 21.3 7.31 24 12 24Z"
          />
          <path
            fill="#FBBC05"
            d="M5.24 14.26A7.2 7.2 0 0 1 4.86 12c0-.79.14-1.55.38-2.26V6.62H1.24A12 12 0 0 0 0 12c0 1.94.46 3.77 1.24 5.38l4-3.12Z"
          />
          <path
            fill="#EA4335"
            d="M12 4.75c1.77 0 3.36.61 4.61 1.8l3.46-3.46C17.95 1.19 15.24 0 12 0 7.31 0 3.22 2.7 1.24 6.62l4 3.12C6.2 6.87 8.86 4.75 12 4.75Z"
          />
        </svg>
        Continuar con Google
      </button>

      <p class="alt-link">
        ¿Ya tienes una cuenta?
        <a class="text-link underline" routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </section>

  <section class="auth-image-panel" aria-hidden="true">
    <img src="/login-img.jpg" alt="" />
  </section>
</div>
