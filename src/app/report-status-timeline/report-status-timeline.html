@if (exceptionLabel(); as label) {
  <p class="exception" [attr.data-status]="status()">{{ label }}</p>
}
<ol class="timeline" aria-label="Estado del reporte" [attr.data-status]="status()">
  @for (step of steps; track step.id) {
    <li [class.done]="reached(step.id)" [class.current]="current(step.id)">{{ step.label }}</li>
  }
</ol>
