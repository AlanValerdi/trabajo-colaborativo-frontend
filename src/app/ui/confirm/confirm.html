<app-dialog
  [open]="confirm.open()"
  [title]="confirm.title()"
  [showClose]="false"
  layer="confirm"
  titleId="app-confirm-title"
  (closed)="onCancel()"
>
  <p class="confirm-copy">{{ confirm.message() }}</p>
  @if (confirm.error(); as error) {
    <p class="form-error">{{ error }}</p>
  }
  <div dialog-actions class="dialog-actions confirm-actions">
    <button type="button" class="ghost" [disabled]="confirm.busy()" (click)="onCancel()">
      {{ confirm.cancelLabel() }}
    </button>
    <button
      type="button"
      class="primary"
      [class.danger]="confirm.danger()"
      [disabled]="confirm.busy()"
      (click)="onConfirm()"
    >
      {{ confirm.busy() ? 'Procesando…' : confirm.confirmLabel() }}
    </button>
  </div>
</app-dialog>
