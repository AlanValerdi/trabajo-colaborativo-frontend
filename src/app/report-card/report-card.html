@if (report(); as item) {
  <article class="card">
    <header class="card-head">
      <strong class="card-title">{{ item.title }}</strong>
    </header>

    <div class="stats">
      <div>
        <strong>{{ item.campusLabel }}</strong>
        <span>Campus</span>
      </div>
      <div>
        <strong>
          @for (line of locationLines(item.spaceLabel); track line) {
            <span class="loc-line">{{ line }}</span>
          }
        </strong>
        <span>Ubicación</span>
      </div>
    </div>

    <app-report-status-timeline [status]="item.status" />

    @if (item.imageUrl) {
      <img class="media" [src]="item.imageUrl" [alt]="item.title" />
    }

    <div class="body">
      <p>{{ item.description }}</p>
    </div>

    <a class="view-btn" [routerLink]="['/inicio/reportes', item.folio]">Ver reporte</a>
    
    <div class="user-chip">
        <span class="avatar">{{ initials(item.author.name) }}</span>
          <span class="user-copy">
            <span class="user-name">
              {{ item.author.name }}
            </span>
          </span>
      </div>
  </article>
}
